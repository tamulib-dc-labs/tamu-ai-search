[project]
name = "tamu-ai"
version = "0.1.0"
description = "AI Mode search service for TAMU Digital Collections (Archipelago)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "pyyaml>=6",
    "sentence-transformers>=3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
tamu-ai = "tamu_ai.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tamu_ai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
